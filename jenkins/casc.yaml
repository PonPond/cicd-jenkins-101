# Jenkins Configuration as Code (JCasC) — ทำให้ Jenkins reproducible
# เข้าธีม "ทุกอย่างเป็นโค้ด" เดียวกับ pipeline: ลบ container แล้ว build ใหม่ ก็ได้ config เดิม
jenkins:
  systemMessage: "cicd-jenkins-101 — local demo (configured via JCasC)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8088/"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-pat"
              username: "ponpond"
              password: "${GH_TOKEN:-changeme}"
              description: "GitHub PAT — push image ขึ้น GHCR (scope: write:packages)"

# สร้าง pipeline job อัตโนมัติจาก Jenkinsfile ใน repo (ผ่าน Job DSL)
jobs:
  - script: >
      pipelineJob('cicd-jenkins-101') {
        description('CI/CD: lint → test → security → k6 → build → push GHCR → deploy staging (docker)')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/ponpond/cicd-jenkins-101.git') }
                branches('main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
  - script: >
      pipelineJob('promote-to-production') {
        description('Promote image ที่ผ่าน staging ขึ้น production (มีด่าน input อนุมัติ)')
        parameters {
          stringParam('IMAGE_TAG', '', 'image tag ที่ผ่าน staging แล้ว เช่น sha-abc1234')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/ponpond/cicd-jenkins-101.git') }
                branches('main')
              }
            }
            scriptPath('jenkins/Jenkinsfile.promote')
          }
        }
      }
