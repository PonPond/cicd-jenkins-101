# Jenkins infra — สำหรับลงบนเซิร์ฟเวอร์จริง
#
# ⭐ ข้อมูลไม่หายแม้ลบ volume:
#   เราใช้ "bind mount" ไปโฟลเดอร์บน host (${JENKINS_HOME_DIR}) ไม่ใช่ named volume
#   → `docker compose down -v` / `docker volume rm` / `docker volume prune` ไม่แตะข้อมูลนี้
#   เพราะมันอยู่บนดิสก์ของ host จริง ๆ ไม่ใช่ใน docker volume
#
# เริ่มใช้:  cp .env.example .env  → แก้ค่า → docker compose up -d --build

services:
  jenkins:
    build: .
    image: jenkins-infra:lts
    container_name: jenkins
    restart: unless-stopped
    # รันเป็น root เพื่อให้เข้าถึง bind mount + docker.sock ได้ตรง ๆ
    # (วิธี hardening แบบ non-root ดูใน README)
    user: root
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"   # Web UI
      - "${JENKINS_AGENT_PORT:-50000}:50000" # inbound agents (เผื่ออนาคต)
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?ต้องตั้ง JENKINS_ADMIN_PASSWORD ใน .env}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080/}
      GH_TOKEN: ${GH_TOKEN:-}
      TZ: ${TZ:-Asia/Bangkok}
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /var/jenkins_conf/casc.yaml
    volumes:
      # ⭐ bind mount → ข้อมูล Jenkins อยู่บน host ที่ ${JENKINS_HOME_DIR} (ไม่หายเมื่อลบ volume)
      - ${JENKINS_HOME_DIR:-./data/jenkins_home}:/var/jenkins_home
      # ให้ Jenkins สั่ง docker บน host ได้ (build/deploy เป็น container)
      - /var/run/docker.sock:/var/run/docker.sock
      # config-as-code (อ่านอย่างเดียว)
      - ./casc.yaml:/var/jenkins_conf/casc.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
